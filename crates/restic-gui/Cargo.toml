[package]
name = "restic-studio-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
restic-core = { path = "../restic-core" }
serde_json = "1"

anyhow = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
