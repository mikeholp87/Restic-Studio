[workspace]
members = ["crates/restic-core", "crates/restic-runner", "crates/restic-gui"]
# The GUI needs GTK 4 and libadwaita development files; build it with `--workspace` or `-p restic-studio-gui`.
default-members = ["crates/restic-core", "crates/restic-runner"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
restic-core = { path = "crates/restic-core" }
